name: MaisonZen iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'iOS/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned IPA for Sideloadly
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Resolve Swift packages
        working-directory: iOS
        run: xcodebuild -resolvePackageDependencies -project MaisonZen.xcodeproj -scheme MaisonZen
      - name: Build unsigned archive
        working-directory: iOS
        run: |
          rm -rf build
          xcodebuild archive \
            -project MaisonZen.xcodeproj \
            -scheme MaisonZen \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/MaisonZen.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA for Sideloadly
        working-directory: iOS
        run: |
          mkdir -p build/Payload
          cp -R build/MaisonZen.xcarchive/Products/Applications/MaisonZen.app build/Payload/
          APP="build/Payload/MaisonZen.app"
          # Keep the unsigned archive compatible with Windows signers such as iPASide.
          # Xcode can leave build-variable placeholders unresolved in an unsigned archive.
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier fr.maisonzen.app" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string fr.maisonzen.app" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.1.0" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 0.1.0" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable MaisonZen" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string MaisonZen" "$APP/Info.plist"
          test -f "$APP/MaisonZen"
          plutil -lint "$APP/Info.plist"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Payload build/MaisonZen-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaisonZen-iOS-unsigned
          path: iOS/build/MaisonZen-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
